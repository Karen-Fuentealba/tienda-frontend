server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos de la SPA. El navegador accede por HTTPS a través de API Gateway,
    # que reenvía "/" y "/{proxy+}" a este nginx (puerto 80 de la EC2 del frontend).
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;   //try_files $uri $uri/ /index.html; HECHO
    }

    # La API NO se proxea aquí: API Gateway envía "/api/*" directo a la EC2 del backend (puerto 3001).
    # Solo si quisieras que nginx haga el proxy al backend, descomenta y reemplaza la IP:
    # >>> COMPLETAR (AWS): IP privada (o DNS) de la EC2 del backend. EC2 > Instances > <backend> > "Private IPv4 address".
    #location /api/ {
    #    proxy_pass http://REEMPLAZAR_IP_PRIVADA_BACKEND:3001;
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #}
}
