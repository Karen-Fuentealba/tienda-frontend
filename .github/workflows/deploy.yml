name: Deploy Frontend to EC2

on:
  workflow_dispatch:   # Permite ejecutar manualmente desde GitHub Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    # Copia el proyecto al servidor EC2
    - name: Copy project files to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "."
        target: "~/tienda-perritos-frontend"

    # Conexión SSH para limpiar, instalar Docker y desplegar el contenedor
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Actualiza paquetes
          sudo apt-get update -y

          # Instala Docker si no está instalado
          if ! command -v docker &> /dev/null
          then
            sudo apt-get install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo usermod -aG docker ${{ secrets.EC2_USER }}
          fi

          # Limpieza completa de contenedores e imágenes anteriores
          sudo docker stop $(sudo docker ps -aq) || true
          sudo docker rm $(sudo docker ps -aq) || true
          sudo docker rmi $(sudo docker images -q) || true
          sudo docker system prune -af || true

          # Construye y corre el nuevo contenedor del frontend
          cd ~/tienda-perritos-frontend
          sudo docker build -t tienda-perritos-frontend .
          sudo docker run -d --name frontend -p 80:80 tienda-perritos-frontend
