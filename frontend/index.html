<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Perritos - Login</title>
</head>
<body>
  <h1>Bienvenido a Tienda Perritos</h1>

  <!-- Botones de login -->
  <button id="login-admin">Iniciar sesión como Administrador</button>
  <button id="login-cliente">Iniciar sesión como Cliente</button>

  <!-- Librería MSAL -->
  <script src="vendor/msal-browser.min.js"></script>

  <!-- Configuración de autenticación -->
  <script>
    const msalConfig = {
      auth: {
        clientId: "TU-CLIENT-ID-SPA", // GUID del SPA en Entra ID
        authority: "https://Karen004V.b2clogin.com/Karen004V.onmicrosoft.com/B2C_1_signupsignin",
        redirectUri: "https://oyvhdgexqa.execute-api.us-east-1.amazonaws.com/dev"
      }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    async function iniciarSesion(rol) {
      try {
        const loginResponse = await msalInstance.loginPopup({
          scopes: ["openid", "profile", "https://TU-API-ID/access_as_user"]
        });

        // Guardar token en localStorage
        localStorage.setItem("token", loginResponse.accessToken);

        // Redirigir según rol
        if (rol === "admin") {
          window.location.href = "admin.html";
        } else {
          window.location.href = "cliente.html";
        }
      } catch (error) {
        console.error("Error en login:", error);
      }
    }

    // Conectar botones
    document.getElementById("login-admin").addEventListener("click", () => {
      iniciarSesion("admin");
    });

    document.getElementById("login-cliente").addEventListener("click", () => {
      iniciarSesion("cliente");
    });
  </script>
</body>
</html>
