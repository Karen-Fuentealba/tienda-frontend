name: Deploy Backend and DB

on:
  workflow_dispatch:   # ejecución manual

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to EC2 Backend
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_BACKEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Actualizar paquetes
            sudo apt-get update -y

            # Instalar Docker y docker-compose si no están
            sudo apt-get install -y docker.io docker-compose git

            # Habilitar y arrancar Docker
            sudo systemctl enable docker
            sudo systemctl start docker

            # Limpiar contenedores, volúmenes e imágenes previas
            sudo docker-compose down -v || true
            sudo docker system prune -af -y || true

            # Eliminar carpeta anterior del proyecto
            rm -rf /home/ubuntu/backend-app

            # Clonar el repositorio desde GitHub
            git clone https://github.com/<TU-USUARIO>/<TU-REPO>.git /home/ubuntu/backend-app

            # Ir al directorio del backend
            cd /home/ubuntu/backend-app

            # Cambiar a la rama backend
            git checkout backend

            # Levantar backend + base de datos desde cero
            sudo docker-compose up -d --build
