<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda Perritos - Login</title>
</head>
<body>
  <h1>Bienvenido a Tienda Perritos</h1>

  <!-- Vista de acceso -->
  <div id="accessView">
    <button id="btnIniciarSesionAdmin">Iniciar sesión como Administrador</button>
    <button id="btnIniciarSesionCliente">Iniciar sesión como Cliente</button>
    <div id="accessStatus" class="status"></div>
  </div>

  <!-- Identidad de sesión -->
  <div id="sessionIdentity" hidden></div>
  <button id="btnCerrarSesion" hidden>Cerrar sesión</button>

  <!-- Vista administrador -->
  <div id="appView" hidden>
    <h2>Gestión de Productos</h2>
    <button id="btnCargar">Cargar Productos</button>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tbodyProductos"></tbody>
    </table>
    <h3 id="formTitle">Nuevo producto</h3>
    <input id="nombre" placeholder="Nombre">
    <input id="descripcion" placeholder="Descripción">
    <input id="precio" type="number" placeholder="Precio">
    <input id="stock" type="number" placeholder="Stock">
    <button id="btnGuardar">Guardar</button>
    <button id="btnCancelar">Cancelar</button>
    <div id="status" class="status"></div>
  </div>

  <!-- Vista cliente -->
  <div id="clientView" hidden>
    <h2>Catálogo</h2>
    <table>
      <thead>
        <tr>
          <th>Nombre</th><th>Descripción</th><th>Precio</th><th>Stock</th><th>Acción</th>
        </tr>
      </thead>
      <tbody id="tbodyCatalogo"></tbody>
    </table>

    <h2>Pedidos</h2>
    <table>
      <thead>
        <tr>
          <th>Producto</th><th>Cantidad</th><th>Precio Unitario</th><th>Fecha</th>
        </tr>
      </thead>
      <tbody id="tbodyPedidos"></tbody>
    </table>
    <div id="clienteStatus" class="status"></div>

    <!-- Carrito -->
    <div id="cartWidget" hidden>
      <button id="btnCarrito">Carrito (<span id="cartCount">0</span>)</button>
      <div id="cartPanel" hidden>
        <ul id="cartItems"></ul>
        <div id="cartEmpty">Carrito vacío</div>
        <div id="cartTotal"></div>
        <button id="btnConfirmarCompra">Confirmar Compra</button>
        <button id="btnVaciarCarrito">Vaciar Carrito</button>
        <div id="cartToast" hidden></div>
      </div>
    </div>
  </div>

  <!-- Librería MSAL -->
  <script src="vendor/msal-browser.min.js"></script>

  <!-- Configuración de autenticación -->
  <script src="authConfig.js"></script>

  <!-- Servicio de autenticación -->
  <script>
    const msalAdmin = new msal.PublicClientApplication(authConfig.admin.msal);
    const msalCliente = new msal.PublicClientApplication(authConfig.cliente.msal);

    async function iniciarSesion(rol) {
      try {
        const msalInstance = rol === "admin" ? msalAdmin : msalCliente;
        const loginRequest = rol === "admin" ? authConfig.admin.loginRequest : authConfig.cliente.loginRequest;

        const loginResponse = await msalInstance.loginPopup(loginRequest);
        localStorage.setItem("token", loginResponse.accessToken);

        if (rol === "admin") {
          document.getElementById("appView").hidden = false;
        } else {
          document.getElementById("clientView").hidden = false;
        }
      } catch (error) {
        console.error(error);
        document.getElementById("accessStatus").textContent = "Error en login: " + error.message;
      }
    }

    function cerrarSesion() {
      localStorage.removeItem("token");
      location.reload();
    }

    // Conectar botones
    document.getElementById("btnIniciarSesionAdmin").addEventListener("click", () => iniciarSesion("admin"));
    document.getElementById("btnIniciarSesionCliente").addEventListener("click", () => iniciarSesion("cliente"));
    document.getElementById("btnCerrarSesion").addEventListener("click", cerrarSesion);
  </script>

  <!-- Tu lógica de app.js -->
  <script src="app.js"></script>
</body>
</html>
