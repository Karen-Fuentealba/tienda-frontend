name: Deploy Frontend to EC2

on:
  workflow_dispatch:   # Ejecutar manualmente desde GitHub Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    # Copia solo la carpeta frontend al servidor EC2
    - name: Copy frontend folder to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "frontend/*"
        target: "~/tienda-perritos-frontend/frontend"

    # Conexión SSH para limpiar, instalar Docker y desplegar el contenedor
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Actualiza paquetes
          sudo apt-get update -y

          # Instala Docker si no está instalado
          if ! command -v docker &> /dev/null
          then
            sudo apt-get install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo usermod -aG docker ${{ secrets.EC2_USER }}
          fi

          # Limpieza segura de contenedores e imágenes
          if [ "$(sudo docker ps -aq)" ]; then
            sudo docker stop $(sudo docker ps -aq)
            sudo docker rm $(sudo docker ps -aq)
          fi

          if [ "$(sudo docker images -q)" ]; then
            sudo docker rmi $(sudo docker images -q)
          fi

          sudo docker system prune -af || true

          # Construye y corre el nuevo contenedor del frontend desde la carpeta correcta
          cd ~/tienda-perritos-frontend/frontend
          if [ -f Dockerfile ]; then
            sudo docker build -t tienda-perritos-frontend .
            sudo docker run -d --name frontend -p 80:80 tienda-perritos-frontend
          else
            echo "❌ ERROR: No se encontró Dockerfile en ~/tienda-perritos-frontend/frontend"
            exit 1
          fi
