name: Deploy Backend to EC2

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST_BACKEND }} >> ~/.ssh/known_hosts

      - name: Copy backend project files to EC2
        run: |
          rsync -avz --delete ./backend ubuntu@${{ secrets.EC2_HOST_BACKEND }}:~/tienda-perritos-backend/

      - name: Build and run backend with docker-compose
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_BACKEND }} << 'EOF'
          cd ~/tienda-perritos-backend
          sudo docker compose down -v || true
          sudo docker system prune -af --force || true
          sudo docker compose up -d --build
          sudo docker ps -a
          EOF

      - name: Test backend response
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST_BACKEND }} << 'EOF'
          curl -I localhost:3001 || true
          EOF
