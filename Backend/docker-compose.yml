services:
  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=root
      # Los valores se leen del archivo Backend/.env que creas en la EC2 del backend (ver Backend/.env.example).
      - DB_PASSWORD=${DB_PASSWORD}
      # Debe llamarse igual que la base creada en db/init.sql.
      - DB_NAME=tienda_perritos
      - AAD_TENANT_ID=${AAD_TENANT_ID}
      - AAD_AUDIENCE=${AAD_AUDIENCE}
      - AAD_EXTERNAL_TENANT_ID=${AAD_EXTERNAL_TENANT_ID}
      - AAD_EXTERNAL_AUDIENCE=${AAD_EXTERNAL_AUDIENCE}
      - AAD_EXTERNAL_AUTHORITY_HOST=${AAD_EXTERNAL_AUTHORITY_HOST}
    restart: always

  db:
    build: ./db
    container_name: backend_db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=tienda_perritos
    volumes:
      - db_data:/var/lib/mysql
    # MySQL solo se usa dentro de la red de Docker; no se publica el 3306 a internet.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

volumes:
  db_data:
